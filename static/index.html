<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFD60A">
<title>Sidechick · chat. play. poof.</title>
<meta name="description" content="Private rooms that disappear when you leave. Chat and play quick games with your people.">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HOME -->
<main id="home" class="screen active">
  <div class="home-inner">
    <div class="logo">sidechick<span>.</span></div>
    <h1>Chat. Play.<br>Poof. <span class="wiggle">💨</span></h1>
    <p class="sub">Private rooms that disappear when everyone leaves.</p>

    <button id="btn-create" class="btn big" disabled>Start a room</button>
    <div class="or">or</div>
    <form id="join-form" class="code-row" autocomplete="off">
      <input id="code-input" maxlength="4" placeholder="CODE" inputmode="text" autocapitalize="characters" aria-label="Room code">
      <button class="btn alt" id="btn-join" disabled>Join</button>
    </form>
    <p id="conn" class="conn">Waking up the server… ☕</p>
    <p class="tiny">No sign-up. No history. Nothing saved.</p>
  </div>
</main>

<!-- WHO ARE YOU -->
<main id="who" class="screen">
  <div class="home-inner">
    <button class="back" id="who-back" aria-label="Back">←</button>
    <h2>Who's joining?</h2>
    <div id="emoji-grid" class="emoji-grid"></div>
    <input id="name-input" maxlength="16" placeholder="Your nickname" aria-label="Nickname">
    <button id="btn-enter" class="btn big">Let's go →</button>
    <p id="who-room" class="tiny"></p>
  </div>
</main>

<!-- ROOM -->
<main id="room" class="screen">
  <header class="top">
    <button class="icon" id="btn-leave" aria-label="Leave room">←</button>
    <button class="code-chip" id="btn-code" aria-label="Copy room code"><b id="room-code">----</b><small>tap to copy</small></button>
    <div id="faces" class="faces"></div>
    <div id="vibe" class="vibe" title="Room vibe">✨</div>
    <button class="btn small" id="btn-invite">Invite</button>
  </header>

  <section id="feed" class="feed" aria-live="polite">
    <div id="empty" class="empty">
      <div class="big-emoji">🎉</div>
      <h3>Your room is live</h3>
      <p>Send the link to your people. This room vanishes when everyone leaves.</p>
      <button class="btn" id="btn-invite2">Share invite link</button>
    </div>
  </section>
  <div id="typing" class="typing"></div>

  <form id="composer" class="composer" autocomplete="off">
    <button type="button" class="icon play" id="btn-play" aria-label="Play a game">🎮</button>
    <input id="msg-input" maxlength="500" placeholder="Say something…" aria-label="Message">
    <button class="send" aria-label="Send">↑</button>
  </form>

  <!-- game picker -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card">
      <div class="grab"></div>
      <h3>Pick a game</h3>
      <div id="game-list"></div>
      <button class="btn ghost" id="sheet-close">Close</button>
    </div>
  </div>

  <!-- game screen -->
  <div id="game" class="game" hidden></div>
</main>

<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
<script src="js/app.js"></script>
</body>
</html>
